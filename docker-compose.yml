services:
  postgres:
    image: postgres:16-alpine
    container_name: fems_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fems_db
    ports:
      - "5432:5432"
    volumes:
      - fems_pg_data:/var/lib/postgresql/data

volumes:
  fems_pg_data:
